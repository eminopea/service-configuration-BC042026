booking:
  property: Profile Account Dev Profile

spring:
  application:
    name: ms-account
  data:
    mongodb:
      uri: mongodb://localhost:27017/accountdb

  kafka:
    bootstrap-servers: localhost:29092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    properties:
      spring:
        json:
          trusted:
            packages: "*"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

server:
  port: 7083

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: always

# CONFIG RESILIENCE4J
resilience4j:
  circuitbreaker:
    instances:

      customerServiceCB:
        registerHealthIndicator: true

        # Configuración de comportamiento
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true

      cardServiceCB:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true


  timelimiter:
    instances:
      customerServiceCB:
        timeoutDuration: 2s   # (timeout 2s)

      cardServiceCB:
        timeoutDuration: 2s
# Configuración WebClient (si usas Eureka)
services:
  customer:
    url: http://ms-customer
  card:
    url: http://ms-card
  transaction:
    url: http://ms-transaction

account:
  savings:
    max-transactions: 10
  current:
    maintenance-fee: 5.00
  fixed-term:
    allowed-day: 15


app:
  kafka:
    topics:
      account-created: account-created
