booking:
  property: Profile Card Dev Profile

spring:
  application:
    name: ms-card
  data:
    mongodb:
      uri: mongodb://localhost:27017/carddb
    redis:
      host: localhost
      port: 6379
      timeout: 2s

    cache:
      type: redis

  redis:
    lettuce:
       pool:
         max-active: 8
         max-idle: 8
         min-idle: 0

  kafka:
    bootstrap-servers: localhost:29092

    consumer:
      group-id: card-group
      auto-offset-reset: earliest

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

app:
  kafka:
    topics:
      account-created: account-created

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

server:
  port: 7084