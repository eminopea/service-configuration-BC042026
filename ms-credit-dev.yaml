eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

server:
  port: 7085

# CONFIG RESILIENCE4J
resilience4j:
  circuitbreaker:
    instances:

      customerServiceCB:
        registerHealthIndicator: true

        # Configuración de comportamiento
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true

      creditServiceCB:
        registerHealthIndicator: true

        # Configuración de comportamiento
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true

  timelimiter:
    instances:
      customerServiceCB:
        timeoutDuration: 2s   # (timeout 2s)
      creditServiceCB:
        timeoutDuration: 2s   # (timeout 2s)
# Configuración WebClient (si usas Eureka)
services:
  customer:
    url: http://ms-customer
  credit:
    url: http://ms-credit