booking:
  property: Profile Credit Dev Profile

spring:
  application:
    name: ms-credit
  data:
    mongodb:
      uri: mongodb://localhost:27017/creditdb
    redis:
      host: localhost
      port: 6379
      timeout: 2s

    cache:
      type: redis

  redis:
    lettuce:
       pool:
         max-active: 8
         max-idle: 8
         min-idle: 0

